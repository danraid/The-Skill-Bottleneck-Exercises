name: Validate The Skill Bottleneck companion materials
on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'labs/**'
      - 'content-manifest.json'
      - '.github/workflows/build-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm all textbook exercises and public answers
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.')
          manifest=json.loads(Path('content-manifest.json').read_text())
          chapters=manifest['chapters']
          assert len(chapters)==20 and manifest['lab_count']==14
          total_exercises=total_questions=0
          for c in chapters:
              n=c['number']
              folder=root/'chapters'/n
              for name in ('README.md','exercises.md','answers.md'):
                  assert (folder/name).is_file(),f'{n}:{name}'
              e=(folder/'exercises.md').read_text()
              a=(folder/'answers.md').read_text()
              count=e.count('### E')
              q=e.count('### Q')
              assert count==c['exercises'],(n,count,c['exercises'])
              assert q==c['questions'],(n,q,c['questions'])
              assert a.count('### E')==count,(n,'missing exercise answers')
              assert a.count('### Q')==q,(n,'missing review answers')
              for lab in c['labs']:
                  assert (root/'labs'/lab/'README.md').is_file(),(n,lab)
              total_exercises+=count;total_questions+=q
          assert total_exercises==manifest['total_exercises']
          assert total_questions==manifest['total_review_questions']
          print('CHAPTER_LINKS_AND_ANSWERS_VALID',total_exercises,total_questions)
          PY
      - name: Run reference solutions and verify original execution hashes
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          for i in range(1,15):
              folder=Path('labs')/f'{i:02d}'
              data=json.loads((folder/'execution.json').read_text())
              assert data['exit_code']==0,i
              for name,key in [('main.py','source_sha256'),('test_lab.py','test_sha256')]:
                  assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==data[key],(i,name)
              subprocess.run(['python','-m','unittest','-v','test_lab.py'],cwd=folder,check=True)
          print('ALL_14_COMPANION_LABS_RETESTED')
          PY
      - name: Verify canonical print links resolve to actual files
        run: |
          python - <<'PY'
          from pathlib import Path
          for i in range(1,21):
              n=f'{i:02d}'
              assert (Path('chapters')/n/'README.md').is_file()
              assert (Path('chapters')/n/'exercises.md').is_file()
              assert (Path('chapters')/n/'answers.md').is_file()
          print('20_CHAPTER_URL_TARGETS_PRESENT')
          PY
